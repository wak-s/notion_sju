<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나에게 맞는 노션 찾기 · 세종이네 노션</title>
<!-- 📌 수정 포인트 ⓪ 글꼴: Pretendard (국문·영문 공통). 다른 폰트로 바꾸려면 이 줄의 주소와 아래 --font-ko / --font-en 이름을 같이 바꾸세요. -->
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ==========================================================
   📌 수정 포인트 ① 색상 — 여기 값만 바꾸면 사이트 전체 색이 바뀌어요
   ========================================================== */
:root {
  --paper: #F4EEE3;        /* 바깥 크림 종이 배경 */
  --page: #FFFFFF;         /* 가운데 노션 페이지 */
  --ink: #37352F;          /* 본문 글자 (노션 기본 글자색) */
  --muted: #8A877F;        /* 흐린 글자 */
  --line: #E9E6DF;         /* 구분선 */
  --hover: #F3F1EC;        /* 블록에 마우스 올렸을 때 */
  --callout: #F8F6F1;      /* 콜아웃 배경 */
  --burgundy: #8C1D2E;     /* 세종 버건디 (강조 · 결과 동그라미) */
  --red: #B3202F;          /* 시그니처 바 레드 */
  --pastel-1: #F6E6DA;     /* 파스텔 소품 1 */
  --pastel-2: #E6EDF4;     /* 파스텔 소품 2 */
  --font-ko: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-en: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-ko);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  padding: 72px 16px 96px;
}

/* 우상단 Campus Leader 뱃지 (고정 요소) */
.badge {
  position: fixed; top: 14px; right: 16px; z-index: 20;
  font-family: var(--font-en); font-size: 11px; letter-spacing: .02em;
  color: var(--burgundy); background: var(--page);
  border: 1px solid var(--burgundy); border-radius: 999px;
  padding: 5px 12px 4px;
}

/* 하단 빨간 시그니처 바 (고정 요소) */
.signature {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--red); color: #fff; text-align: center;
  font-size: 13px; font-weight: 700; padding: 11px 16px;
  letter-spacing: .01em;
}
.signature em { font-family: var(--font-en); font-style: normal; font-weight: 400; opacity: .9; }

/* 가운데 노션 페이지 */
.page {
  max-width: 720px; margin: 0 auto;
  background: var(--page);
  border-radius: 6px;
  box-shadow: 0 1px 2px rgba(55,53,47,.06), 0 8px 28px rgba(55,53,47,.07);
  padding: 44px 56px 48px;
}
@media (max-width: 600px) {
  body { padding: 60px 12px 88px; }
  .page { padding: 32px 22px 36px; }
}

/* 페이지 머리 (노션 페이지 아이콘 + 제목) */
.page-icon { line-height: 0; margin-bottom: 14px; }
.page-icon img { width: 76px; height: 76px; border-radius: 50%; display: block; }
.eyebrow { font-family: var(--font-en); font-weight: 600; letter-spacing: .01em; color: var(--burgundy); font-size: 14px; margin: 0 0 4px; }
h1 { font-size: 32px; font-weight: 800; line-height: 1.3; margin: 0 0 10px; letter-spacing: -.01em; }
.lead { color: var(--muted); margin: 0 0 26px; font-size: 15px; }
@media (max-width: 600px) { h1 { font-size: 26px; } }

/* 콜아웃 블록 (노션 콜아웃) */
.callout {
  display: flex; gap: 12px; align-items: flex-start;
  background: var(--callout); border-radius: 4px;
  padding: 14px 16px; margin: 0 0 14px; font-size: 15px;
}
.callout .ico { font-size: 20px; line-height: 1.4; }
.callout p { margin: 0; }
.callout strong { display: block; margin-bottom: 2px; }

/* 답변 기록 블록 (위로 한 줄씩 쌓임) */
#log { margin-bottom: 6px; }
.log-item {
  width: 100%; display: flex; align-items: baseline; gap: 10px;
  background: none; border: 0; border-radius: 4px; cursor: pointer;
  font: inherit; color: var(--ink); text-align: left;
  padding: 5px 8px; margin: 0 -8px;
  animation: blockIn .28s ease both;
}
.log-item:hover { background: var(--hover); }
.log-item .check { color: var(--burgundy); font-weight: 800; }
.log-item .log-q { color: var(--muted); font-size: 14px; white-space: nowrap; }
.log-item .log-a { word-break: keep-all; }
.log-item .log-a { font-weight: 700; font-size: 15px; }
.log-item .log-edit { margin-left: auto; font-size: 12px; color: var(--muted); opacity: 0; transition: opacity .15s; }
.log-item:hover .log-edit { opacity: 1; }
.divider { border: 0; border-top: 1px solid var(--line); margin: 14px 0 22px; }

/* 질문 블록 */
.q-block { animation: blockIn .32s ease both; }
.q-meta { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.q-meta b { color: var(--burgundy); }
.q-title { font-size: 21px; font-weight: 800; line-height: 1.45; margin: 0 0 16px; }
.q-title .q-emoji { margin-right: 8px; }
.options { display: flex; flex-direction: column; gap: 6px; }
.opt {
  display: flex; align-items: center; gap: 12px; width: 100%;
  font: inherit; font-size: 16px; color: var(--ink); text-align: left;
  background: var(--page); border: 1px solid var(--line); border-radius: 6px;
  padding: 13px 16px; cursor: pointer;
  transition: background .12s, border-color .12s;
}
.opt:hover { background: var(--hover); }
.opt .box {
  flex: 0 0 18px; height: 18px; border: 1.5px solid #C9C6BF; border-radius: 3px;
  display: grid; place-items: center; font-size: 12px; color: #fff; font-weight: 800;
}
.opt.picked { border-color: var(--burgundy); background: #FBF4F4; }
.opt.picked .box { background: var(--burgundy); border-color: var(--burgundy); }
.opt:disabled { cursor: default; }

/* 버튼 */
.btn {
  font: inherit; font-weight: 800; font-size: 15px; cursor: pointer;
  border-radius: 6px; padding: 12px 18px; border: 1px solid transparent;
  transition: filter .12s, background .12s;
}
.btn-primary { background: var(--burgundy); color: #fff; }
.btn-primary:hover { filter: brightness(1.08); }
.btn-secondary { background: var(--page); color: var(--burgundy); border-color: var(--burgundy); }
.btn-secondary:hover { background: #FBF4F4; }
.btn-link { background: none; border: 0; color: var(--muted); font: inherit; font-size: 14px; cursor: pointer; text-decoration: underline; padding: 6px 0; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 10px; }
.actions .btn { flex: 1 1 180px; }

/* 결과 페이지 */
.result { animation: blockIn .4s ease both; }
.result-cover {
  height: 120px; border-radius: 6px; margin-bottom: 18px;
  background: linear-gradient(120deg, var(--pastel-1), var(--pastel-2));
  display: grid; place-items: center; font-size: 56px; overflow: hidden;
}
.result-cover img { height: 100px; width: auto; }
.result-kicker { color: var(--muted); font-size: 14px; margin: 0 0 6px; }
.result-title { font-size: 30px; font-weight: 800; margin: 4px 0 12px; line-height: 1.35; }
@media (max-width: 600px) { .result-title { font-size: 25px; } }

/* 결과 이름 둘레 버건디 동그라미 (선이 한 바퀴 그어지며 나타남) */
.circled { position: relative; display: inline-block; padding: 0 14px; margin: 0 4px; }
.circled svg {
  position: absolute; left: -12px; top: -12px;
  width: calc(100% + 24px); height: calc(100% + 22px);
  overflow: visible; pointer-events: none;
}
.circled path {
  fill: none; stroke: var(--burgundy); stroke-width: 2.4; stroke-linecap: round;
  stroke-dasharray: 1; stroke-dashoffset: 1;
  animation: drawCircle .5s ease-out .35s forwards;
}
@keyframes drawCircle { to { stroke-dashoffset: 0; } }

.tag {
  display: inline-block; font-size: 13px; font-weight: 700;
  color: var(--burgundy); background: #F7ECEC; border-radius: 3px;
  padding: 2px 8px; margin-bottom: 14px;
}
.result-desc { font-size: 16px; margin: 0 0 18px; }
.notes { margin: 0 0 16px; padding-left: 22px; }
.notes li { margin: 4px 0; }

/* 토글 (노션 토글) */
details.toggle { margin: 4px 0 16px; }
details.toggle summary {
  cursor: pointer; list-style: none; font-weight: 700; padding: 4px 8px; margin: 0 -8px; border-radius: 4px;
}
details.toggle summary::-webkit-details-marker { display: none; }
details.toggle summary::before { content: '▸'; display: inline-block; width: 18px; color: var(--muted); transition: transform .15s; }
details.toggle[open] summary::before { transform: rotate(90deg); }
details.toggle summary:hover { background: var(--hover); }
details.toggle ul { margin: 6px 0 0; padding-left: 26px; color: var(--ink); font-size: 15px; }

/* 📌 신청 영역 (이름·전화번호·동의) */
.apply { border: 1px solid var(--line); border-radius: 6px; padding: 18px 18px 14px; margin: 18px 0 10px; }
.apply h3 { font-size: 17px; font-weight: 800; margin: 0 0 4px; }
.apply .sub { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
.field { display: block; margin-bottom: 12px; }
.field span { display: block; font-size: 13px; font-weight: 700; margin-bottom: 5px; }
.field input {
  width: 100%; font: inherit; font-size: 16px; color: var(--ink);
  border: 1px solid var(--line); border-radius: 6px; padding: 11px 12px; background: var(--page);
}
.field input:focus { outline: none; border-color: var(--burgundy); box-shadow: 0 0 0 3px #F3E3E5; }
.field input.invalid { border-color: var(--red); }
.err { color: var(--red); font-size: 13px; margin: 4px 0 0; min-height: 0; }
.consent { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; margin: 4px 0 6px; cursor: pointer; }
.consent input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--burgundy); flex: 0 0 auto; }
.consent-detail { font-size: 13px; color: var(--muted); margin: 0 0 6px 28px; }
.consent-detail summary { cursor: pointer; text-decoration: underline; }
.consent-detail ul { margin: 6px 0 0; padding-left: 18px; }
.apply .btn-primary { width: 100%; margin-top: 10px; }
.btn-primary:disabled { opacity: .45; cursor: not-allowed; filter: none; }

/* 📌 신청 팝업 (Fillout 폼이 뜨는 창) */
.modal { position: fixed; inset: 0; z-index: 40; background: rgba(35,33,30,.55); display: grid; place-items: center; padding: 16px; animation: blockIn .2s ease both; }
.modal-box { background: var(--page); width: min(560px, 100%); height: min(620px, 88vh); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--line); font-weight: 800; font-size: 15px; }
.modal-head button { background: none; border: 0; font-size: 22px; line-height: 1; cursor: pointer; color: var(--muted); padding: 2px 6px; }
.modal iframe { flex: 1; width: 100%; border: 0; }
.modal-foot { padding: 8px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); text-align: center; }
.modal-foot a { color: var(--muted); }

@keyframes blockIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition: none !important; }
  .circled path { stroke-dashoffset: 0; }
}

.toast {
  position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%);
  background: var(--ink); color: #fff; font-size: 14px; border-radius: 6px;
  padding: 9px 14px; z-index: 30; animation: blockIn .2s ease both;
}
</style>
</head>

const NOTES = {

/* ==========================================================
   로직 — 질문 순서 정하기 (여기부터는 설계한 로직 그대로예요)
   ========================================================== */
const TOTAL = 4;
let answers = {};   // { 질문id: 고른 선택지 번호(0,1,2) }
let order = [];     // 지금까지 답한 질문 id 순서

// 지금까지의 답을 보고 다음 질문 id를 돌려줘요. 끝났으면 null.
function nextQuestionId() {
  const seq = questionSequence();
  return seq.find(id => !(id in answers)) || null;
}

// Q1 답과 (③이면) Q2 답에 따라 4문항 경로가 정해져요.
function questionSequence() {
  const t = answers.q1;
  if (t === undefined) return ['q1'];
  if (t === 0) return ['q1', 'ind_topic', 'ind_help', 'ind_level'];          // ① 개인
  if (t === 1) return ['q1', 'org_worry', 'org_period', 'org_usage'];        // ② 대표
  const g = answers.mem_goal;                                                // ③ 운영진·멤버
  if (g === undefined) return ['q1', 'mem_goal'];
  if (g === 0) return ['q1', 'mem_goal', 'org_worry', 'org_period'];        //   동아리 전체 → 조직 결과
  if (g === 1) return ['q1', 'mem_goal', 'mem_role', 'ind_level'];          //   내 역할 → M1
  return ['q1', 'mem_goal', 'ind_topic', 'ind_help'];                       //   개인 학습 → 개인 결과
}

/* 결과 계산 */
function computeResult() {
  const a = answers;
  let code;
  let path;   // 파일에 남길 경로 이름

  // 개인 결과 (① 개인 / ③-개인 학습): 주제(Q) × 형태(Q)
  if ('ind_topic' in a) {
    code = a.ind_help === 1 ? 'P4' : ['P1', 'P2', 'P3'][a.ind_topic];
    path = '개인';
  }
  // 조직 결과 (② 대표 / ③-동아리 전체): 점수 합산
  else if ('org_worry' in a) {
    const s = { O1: 0, O2: 0, O3: 0, O4: 0 };
    [[['O1', 2]], [['O2', 2]], [['O3', 1], ['O4', 1]]][a.org_worry].forEach(([k, v]) => s[k] += v);
    [[['O3', 2], ['O2', 1]], [['O1', 1], ['O4', 1]], [['O2', 1], ['O4', 1]]][a.org_period].forEach(([k, v]) => s[k] += v);
    // 동점이면 고민(Q2)에서 고른 쪽이 이겨요
    const family = [['O1'], ['O2'], ['O3', 'O4']][a.org_worry];
    code = Object.keys(s).sort((x, y) =>
      (s[y] - s[x]) || ((family.includes(y) ? 1 : 0) - (family.includes(x) ? 1 : 0))
    )[0];
    path = '조직';
  }
  // 역할 결과 (③-내 역할)
  else {
    code = 'M1';
    path = '역할';
  }

  // 보조 문구
  const notes = [];
  const isTemplate = ['P1', 'P2', 'P3', 'M1'].includes(code);
  if ('ind_level' in a && isTemplate) {
    if (a.ind_level === 0) notes.push(NOTES.levelBeginner);
    if (a.ind_level === 2) notes.push(NOTES.levelAdvanced);
  }
  if (a.ind_help === 2) notes.push(NOTES.wantSetup);
  if ('org_usage' in a) notes.push(NOTES.usage[a.org_usage]);
  if (a.q1 === 2 && path === '조직') notes.push(NOTES.memberOrg);

  // 추천 이유 속 {자리} 채우기
  const fill = str => str
    .replace('{topic}', 'ind_topic' in a ? QUESTIONS.ind_topic.options[a.ind_topic].label : '')
    .replace('{period}', 'org_period' in a ? QUESTIONS.org_period.options[a.org_period].label : '')
    .replace('{role}', 'mem_role' in a ? QUESTIONS.mem_role.options[a.mem_role].label : '');

  const r = RESULTS[code];
  return {
    code, path, notes,
    name: r.name, category: r.category, emoji: r.emoji, image: r.image, link: r.link,
    desc: fill(r.desc), reason: fill(r.reason),
    wantSetup: a.ind_help === 2,
  };
}

/* ==========================================================
   화면 그리기
   ========================================================== */
const $log = document.getElementById('log');
const $stage = document.getElementById('stage');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function renderStart() {
  $log.innerHTML = '';
  $stage.innerHTML = `
    <div class="q-block">
      <div class="callout"><span class="ico">💡</span>
        <p>1분이면 끝나요. 고른 답은 위에 차곡차곡 쌓이고, 누르면 언제든 다시 고를 수 있어요.</p>
      </div>
      <button class="btn btn-primary" id="startBtn">시작하기</button>
    </div>`;
  document.getElementById('startBtn').onclick = () => { renderLog(); renderQuestion(); };
}

function renderLog() {
  if (!order.length) { $log.innerHTML = ''; return; }
  $log.innerHTML = order.map((id, i) => {
    const q = QUESTIONS[id];
    return `<button class="log-item" data-i="${i}" title="눌러서 다시 고르기">
      <span class="check">✓</span>
      <span class="log-q">${esc(q.log)}</span>
      <span class="log-a">${esc(q.options[answers[id]].short)}</span>
      <span class="log-edit">다시 고르기</span>
    </button>`;
  }).join('') + '<hr class="divider">';
  $log.querySelectorAll('.log-item').forEach(el => el.onclick = () => rewind(+el.dataset.i));
}

// 답한 질문을 누르면 그 질문부터 다시 풀어요 (뒤의 답은 지워져요)
function rewind(i) {
  order.slice(i).forEach(id => delete answers[id]);
  order = order.slice(0, i);
  renderLog();
  renderQuestion();
}

function renderQuestion() {
  const id = nextQuestionId();
  if (!id) return renderResult();
  const q = QUESTIONS[id];
  const n = order.length + 1;
  $stage.innerHTML = `
    <div class="q-block">
      <div class="q-meta">질문 <b>${n}</b> / ${TOTAL}</div>
      <h2 class="q-title"><span class="q-emoji">${q.emoji}</span>${esc(q.title)}</h2>
      <div class="options">
        ${q.options.map((o, i) => `<button class="opt" data-i="${i}"><span class="box">✓</span>${esc(o.text)}</button>`).join('')}
      </div>
    </div>`;
  const btns = $stage.querySelectorAll('.opt');
  btns.forEach(b => b.onclick = () => {
    btns.forEach(x => x.disabled = true);
    b.classList.add('picked');
    setTimeout(() => {
      answers[id] = +b.dataset.i;
      order.push(id);
      renderLog();
      renderQuestion();
    }, 220);
  });
}

function renderResult() {
  const r = computeResult();
  const icon = r.image ? `<img src="${esc(r.image)}" alt="">` : r.emoji;
  $stage.innerHTML = `
    <article class="result">
      <div class="result-cover">${icon}</div>
      <p class="result-kicker">세종이네 노션이 추천하는 결과는..!</p>
      <h2 class="result-title">
        <span class="circled">${esc(r.name)}
          <svg viewBox="0 0 200 60" preserveAspectRatio="none" aria-hidden="true">
            <path pathLength="1" d="M18 34 C 12 12, 70 4, 110 5 C 160 6, 196 16, 193 32 C 190 50, 130 57, 92 56 C 48 55, 6 50, 10 30 C 13 18, 40 10, 62 8"/>
          </svg>
        </span>
      </h2>
      <div><span class="tag">${esc(r.category)}</span></div>
      <p class="result-desc">${esc(r.desc)}</p>

      <div class="callout"><span class="ico">💬</span>
        <div><strong>추천 이유</strong><p>${esc(r.reason)}</p></div>
      </div>

      ${r.notes.length ? `<ul class="notes">${r.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : ''}

      <details class="toggle">
        <summary>내 답변 다시 보기</summary>
        <ul>${order.map(id => `<li>${esc(QUESTIONS[id].title)} → <b>${esc(QUESTIONS[id].options[answers[id]].short)}</b></li>`).join('')}</ul>
      </details>

      ${r.link ? `<div class="actions"><a class="btn btn-secondary" href="${esc(r.link)}" target="_blank" rel="noopener" style="text-align:center;text-decoration:none">관련 페이지 보기</a></div>` : ''}

      <!-- 📌 신청 영역 -->
      <section class="apply">
        <h3>📮 이 결과로 신청하기</h3>
        <p class="sub">${esc(NOTES.apply)}</p>
        <label class="field"><span>이름</span>
          <input id="inName" type="text" autocomplete="name" maxlength="20" placeholder="홍길동">
        </label>
        <label class="field"><span>전화번호</span>
          <input id="inPhone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="13" placeholder="010-1234-5678">
          <p class="err" id="phoneErr"></p>
        </label>
        <label class="consent"><input id="inConsent" type="checkbox">
          <span>(필수) 개인정보 수집·이용에 동의해요</span>
        </label>
        <details class="consent-detail">
          <summary>자세히 보기</summary>
          <ul>
            <li>수집 항목: 이름, 전화번호, 테스트 결과와 답변</li>
            <li>이용 목적: 맞춤 템플릿·행사 안내 및 신청 확인 연락</li>
            <li>보유 기간: ${esc(CONFIG.RETENTION)} (이후 파기)</li>
            <li>동의하지 않을 수 있으며, 이 경우 신청이 어려워요.</li>
          </ul>
        </details>
        <button class="btn btn-primary" id="applyBtn" disabled>신청하기</button>
      </section>

      <div class="actions" style="justify-content:space-between">
        <button class="btn-link" id="saveBtn">결과 파일로 저장</button>
        <button class="btn-link" id="againBtn">처음부터 다시 하기</button>
      </div>
    </article>`;

  const $name = document.getElementById('inName');
  const $phone = document.getElementById('inPhone');
  const $consent = document.getElementById('inConsent');
  const $apply = document.getElementById('applyBtn');
  const $err = document.getElementById('phoneErr');

  // 전화번호는 숫자만 받아서 010-1234-5678 형태로 자동 정리
  $phone.addEventListener('input', () => {
    $phone.value = formatPhone($phone.value);
    $phone.classList.remove('invalid'); $err.textContent = '';
    check();
  });
  $name.addEventListener('input', check);
  $consent.addEventListener('change', check);
  function check() {
    $apply.disabled = !($name.value.trim() && $phone.value.replace(/\D/g, '').length >= 10 && $consent.checked);
  }
  $apply.onclick = () => {
    if (!/^01[016789]-\d{3,4}-\d{4}$/.test($phone.value)) {
      $phone.classList.add('invalid');
      $err.textContent = '전화번호를 다시 확인해 주세요. (예: 010-1234-5678)';
      return;
    }
    openApplyModal(r, $name.value.trim(), $phone.value);
  };

  document.getElementById('saveBtn').onclick = () => downloadResult(r);
  document.getElementById('againBtn').onclick = () => { answers = {}; order = []; renderStart(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
}

function formatPhone(v) {
  const d = v.replace(/\D/g, '').slice(0, 11);
  if (d.length < 4) return d;
  if (d.length < 8) return `${d.slice(0, 3)}-${d.slice(3)}`;
  if (d.length === 10) return `${d.slice(0, 3)}-${d.slice(3, 6)}-${d.slice(6)}`;
  return `${d.slice(0, 3)}-${d.slice(3, 7)}-${d.slice(7)}`;
}

/* ==========================================================
   📌 수정 포인트 ⑧ Fillout으로 넘기는 값
   왼쪽 이름(name, phone …)은 Fillout 폼의 URL 파라미터 이름과 같아야 해요.
   노션 DB 칸과의 연결은 Fillout → Integrate → Notion에서 관리해요.
   ========================================================== */
function buildApplyParams(r, name, phone) {
  const a = answers;
  const pick = id => (id in a) ? QUESTIONS[id].options[a[id]].short : '-';
  return {
    name,
    phone,
    code: r.code,
    result: r.name,
    category: r.category,
    track: TRACK_NAMES[a.q1],
    summary: order.map(id => `${QUESTIONS[id].log}: ${QUESTIONS[id].options[a[id]].short}`).join(' / '),
    setup: r.wantSetup ? '예' : '아니오',
    level: pick('ind_level'),
    usage: pick('org_usage'),
    role: pick('mem_role'),
    consent: '동의',
  };
}

function openApplyModal(r, name, phone) {
  const url = CONFIG.FORM_URL + '?' + new URLSearchParams(buildApplyParams(r, name, phone)).toString();
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <div class="modal-box" role="dialog" aria-label="신청 확인">
      <div class="modal-head"><span>신청 확인</span><button aria-label="닫기">×</button></div>
      <iframe src="${esc(url)}" title="신청 폼" allow="clipboard-write"></iframe>
      <div class="modal-foot">폼이 보이지 않으면 <a href="${esc(url)}" target="_blank" rel="noopener">새 창으로 열기</a></div>
    </div>`;
  const close = () => { modal.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  modal.querySelector('.modal-head button').onclick = close;
  modal.addEventListener('click', e => { if (e.target === modal) close(); });
  document.addEventListener('keydown', onKey);
  document.body.appendChild(modal);
}

/* ==========================================================
   📌 수정 포인트 ⑦ 결과 파일(md) 내용
   맨 위 --- 사이는 "항목: 값" 형태로 고정돼 있어요.
   나중에 노션 DB로 자동 정리할 때 이 부분을 읽으면 돼요.
   ========================================================== */
const TRACK_NAMES = ['개인 학생', '동아리 대표', '운영진·멤버'];

function buildMarkdown(r) {
  const a = answers;
  const now = new Date();
  const pick = id => (id in a) ? QUESTIONS[id].options[a[id]].short : '-';
  const head = [
    '---',
    `결과코드: ${r.code}`,
    `결과: ${r.name}`,
    `분류: ${r.category}`,
    `트랙: ${TRACK_NAMES[a.q1]}`,
    `경로: ${r.path}`,
    `세팅지원희망: ${r.wantSetup ? '예' : '아니오'}`,
    `노션경험: ${pick('ind_level')}`,
    `동아리노션사용: ${pick('org_usage')}`,
    `맡은역할: ${pick('mem_role')}`,
    `생성일시: ${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`,
    '---',
  ];
  const body = [
    '',
    '# 세종이네 노션 · 나에게 맞는 노션 찾기 결과',
    '',
    `## ${r.name} (${r.category})`,
    '',
    r.desc,
    '',
    `**추천 이유** ${r.reason}`,
    '',
    ...(r.notes.length ? [...r.notes.map(n => `- ${n}`), ''] : []),
    '## 내 답변',
    '',
    ...order.map((id, i) => `${i + 1}. ${QUESTIONS[id].title} → ${QUESTIONS[id].options[a[id]].text}`),
    '',
    '---',
    '종이에 그리듯 노션을, 세종이네 노션 @notion_sju',
    '',
  ];
  return head.concat(body).join('\n');
}

function downloadResult(r) {
  const md = buildMarkdown(r);
  const d = new Date();
  const stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}-${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}`;
  const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `세종이네노션_결과_${r.code}_${stamp}.md`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('결과 파일을 저장했어요! 이제 신청 폼에 올려 주세요.');
}

function copyText(text) {
  const done = () => toast('결과 내용을 복사했어요! 신청 폼에 붙여넣어 주세요.');
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { toast('복사가 안 됐어요. 외부 브라우저로 열어 주세요.'); }
  ta.remove();
}

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

renderStart();
</script>
</body>
